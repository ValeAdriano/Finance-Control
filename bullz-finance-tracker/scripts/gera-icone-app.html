<!doctype html>
<!-- Gerador do ícone do app (liquid glass branco, chifres centralizados).
     Desenha num canvas a partir de assets/img/icone-512.png e manda cada PNG por
     POST /salvar?nome=… para um servidorzinho local que grava os arquivos; depois:
       assets/img/app/          icone-app-1024.png, android-frente.png, android-fundo.png
       public/assets/img/       icone-app-*.png, icone-app-maskable-*.png, apple-touch-icon.png
     Para ajustar: mude vidro()/borda()/logo() e rode gera() no console. -->
<html><head><meta charset="utf-8"><title>Gerador do ícone</title>
<style>body{margin:0;background:#888;display:flex;flex-wrap:wrap;gap:16px;padding:16px;font:12px system-ui}figure{margin:0;text-align:center;color:#fff}canvas{display:block;width:240px;height:240px;background:repeating-conic-gradient(#bbb 0 25%,#ddd 0 50%) 0 0/20px 20px}</style>
</head><body>
<script>
// Ícone liquid glass branco: vidro claro com brilho na borda de cima,
// sombra suave embaixo e os chifres centralizados pela área real do desenho.
const RAIO_IOS = 0.2237; // canto contínuo do iOS (a máscara do sistema)

function carrega(src){return new Promise((ok,erro)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=erro;i.src=src;});}

// caixa do desenho (pixels com alpha > 8), não a borda da imagem
function caixa(img){
  const c=document.createElement("canvas");c.width=img.width;c.height=img.height;
  const x=c.getContext("2d");x.drawImage(img,0,0);
  const d=x.getImageData(0,0,c.width,c.height).data;
  let x0=c.width,y0=c.height,x1=0,y1=0;
  for(let y=0;y<c.height;y++)for(let i=0;i<c.width;i++){if(d[(y*c.width+i)*4+3]>8){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y;}}
  return {x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
}

function retanguloRedondo(x,X,Y,W,H,r){
  x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();
}

// o vidro: base branca, luz difusa em cima, leve tom frio embaixo
function vidro(x,S){
  const g=x.createLinearGradient(0,0,0,S);
  g.addColorStop(0,"#ffffff");g.addColorStop(0.55,"#f6f8fb");g.addColorStop(1,"#e7ebf2");
  x.fillStyle=g;x.fillRect(0,0,S,S);
  // reflexo azul muito sutil, como luz passando pelo vidro
  let r=x.createRadialGradient(S*0.78,S*0.92,0,S*0.78,S*0.92,S*0.75);
  r.addColorStop(0,"rgba(10,132,255,0.10)");r.addColorStop(1,"rgba(10,132,255,0)");
  x.fillStyle=r;x.fillRect(0,0,S,S);
  // brilho difuso de cima (a "lente")
  r=x.createRadialGradient(S*0.32,S*0.06,0,S*0.32,S*0.06,S*0.8);
  r.addColorStop(0,"rgba(255,255,255,0.95)");r.addColorStop(0.5,"rgba(255,255,255,0.35)");r.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=r;x.fillRect(0,0,S,S);
  // reflexo largo e macio na metade de cima (sem borda dura)
  r=x.createRadialGradient(S*0.5,S*-0.35,S*0.2,S*0.5,S*-0.35,S*0.95);
  r.addColorStop(0,"rgba(255,255,255,0.7)");r.addColorStop(0.7,"rgba(255,255,255,0.25)");r.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=r;x.fillRect(0,0,S,S);
}

// borda do vidro: luz forte em cima, sombra interna embaixo (segue o canto do iOS)
function borda(x,S){
  const r=S*RAIO_IOS,w=S*0.014;
  x.save();retanguloRedondo(x,0,0,S,S,r);x.clip();
  // sombra interna embaixo
  const s=x.createLinearGradient(0,S*0.7,0,S);
  s.addColorStop(0,"rgba(120,135,160,0)");s.addColorStop(1,"rgba(120,135,160,0.10)");
  x.fillStyle=s;x.fillRect(0,0,S,S);
  // aro de luz
  const g=x.createLinearGradient(0,0,0,S);
  g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(0.35,"rgba(255,255,255,0.55)");
  g.addColorStop(0.7,"rgba(214,221,232,0.3)");g.addColorStop(1,"rgba(190,199,215,0.45)");
  x.lineWidth=w*2;x.strokeStyle=g;retanguloRedondo(x,0,0,S,S,r);x.stroke();
  // fio interno mais claro, dá a espessura do vidro
  x.lineWidth=w*0.6;x.strokeStyle="rgba(255,255,255,0.9)";retanguloRedondo(x,w*1.6,w*1.6,S-w*3.2,S-w*3.2,r-w*1.6);
  const gi=x.createLinearGradient(0,0,0,S);gi.addColorStop(0,"rgba(255,255,255,0.95)");gi.addColorStop(0.5,"rgba(255,255,255,0)");x.strokeStyle=gi;x.stroke();
  x.restore();
}

// os chifres centralizados pela caixa do desenho; `fr` = maior lado / S
function logo(x,S,img,cx,fr){
  const k=Math.min(fr*S/cx.w,fr*S/cx.h*1.0);
  const w=cx.w*k,h=cx.h*k,X=(S-w)/2,Y=(S-h)/2;
  x.save();
  x.shadowColor="rgba(10,70,200,0.28)";x.shadowBlur=S*0.035;x.shadowOffsetY=S*0.016;
  x.drawImage(img,cx.x,cx.y,cx.w,cx.h,X,Y,w,h);
  x.restore();
  return {X,Y,w,h};
}

function novo(S){const c=document.createElement("canvas");c.width=c.height=S;return c;}
function mostra(c,nome){const f=document.createElement("figure");f.appendChild(c);const t=document.createElement("figcaption");t.textContent=nome+" ("+c.width+")";f.appendChild(t);document.body.appendChild(f);}
async function salva(c,nome){const b=await new Promise(ok=>c.toBlob(ok,"image/png"));await fetch("/salvar?nome="+nome,{method:"POST",body:b});}

// ícone completo, sem transparência (iOS e apple-touch: o sistema recorta o canto)
function completo(S,img,cx,{cantos=false,aro=true}={}){
  const c=novo(S),x=c.getContext("2d");
  if(cantos){retanguloRedondo(x,0,0,S,S,S*RAIO_IOS);x.clip();}
  vidro(x,S);if(aro)borda(x,S);logo(x,S,img,cx,0.6);
  return c;
}

window.gera=async function(){
  const img=await carrega("/logo.png");const cx=caixa(img);
  const saidas=[
    ["icone-app-1024.png",completo(1024,img,cx)],                          // iOS / app.json "icon"
    ["icone-app-512.png",completo(512,img,cx,{cantos:true})],              // PWA "any": cantos transparentes
    ["icone-app-192.png",completo(192,img,cx,{cantos:true})],
    ["icone-app-maskable-512.png",completo(512,img,cx,{aro:false})],       // PWA "maskable": sangra até a borda
    ["icone-app-maskable-192.png",completo(192,img,cx,{aro:false})],
    ["apple-touch-icon.png",completo(180,img,cx)],
  ];
  // Android adaptativo: fundo de vidro e frente só com os chifres na zona segura (66/108)
  const fundo=novo(1024);vidro(fundo.getContext("2d"),1024);saidas.push(["android-fundo.png",fundo]);
  const frente=novo(1024);logo(frente.getContext("2d"),1024,img,cx,0.44);saidas.push(["android-frente.png",frente]);
  for(const [n,c] of saidas){mostra(c,n);await salva(c,n);}
  return JSON.stringify(cx);
};
</script>
</body></html>
